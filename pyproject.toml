[project]
name = "core"
version = "0.1.0"
description = "Ravanyar mental-health platform backend"
requires-python = "==3.13.*"
dependencies = [
    "django>=5.2,<6.0",
    "django-ninja>=1.3",
    "psycopg[binary]>=3.2",
    "uvicorn>=0.34",
]

[dependency-groups]
dev = [
    "django-stubs[compatible-mypy]>=5.2",
    "mypy>=1.14",
    "pytest>=8.3",
    "pytest-django>=4.9",
    "ruff>=0.9",
    "testcontainers[postgres]>=4.9",
]

[tool.ruff]
line-length = 100
src = ["src"]
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "DJ", "S", "SIM", "RUF", "T20"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"src/config/settings/*" = ["F403", "F405"]
"**/tests/*" = ["S105", "S106"]
# Scripts are CLIs: print is their output. Application code logs instead (T20).
"scripts/*" = ["S603", "S607", "T20"]

[tool.mypy]
strict = true
plugins = ["mypy_django_plugin.main"]
mypy_path = "src"
exclude = ["migrations"]

[[tool.mypy.overrides]]
module = ["testcontainers.*"]
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "config.settings.test"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
# scripts/: the gates are code too, and are tested like code.
pythonpath = ["src", "scripts"]
testpaths = ["src", "scripts"]
addopts = "--strict-markers -q"
markers = [
    "unit: no database, no containers, milliseconds",
    "integration: real Postgres via testcontainers",
]
