# Production stack: Postgres, the API, and Caddy for TLS. Run from this directory:
#   docker compose up -d --build
name: ravanyar

services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      # The owner role owns the tables; the app connects as a role that cannot drop triggers.
      POSTGRES_USER: ${DB_OWNER_USER}
      POSTGRES_PASSWORD: ${DB_OWNER_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      DB_APP_USER: ${DB_APP_USER}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db-init.sh:/docker-entrypoint-initdb.d/db-init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 10

  # Runs migrations as the owner, then exits. The app never holds owner credentials.
  migrate:
    build: ../backend
    env_file: .env
    environment:
      POSTGRES_USER: ${DB_OWNER_USER}
      POSTGRES_PASSWORD: ${DB_OWNER_PASSWORD}
    command: ["python", "manage.py", "migrate", "--noinput"]
    depends_on:
      db: {condition: service_healthy}

  app:
    build: ../backend
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_USER: ${DB_APP_USER}
      POSTGRES_PASSWORD: ${DB_APP_PASSWORD}
    depends_on:
      migrate: {condition: service_completed_successfully}

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN}
      BASIC_AUTH_USER: ${BASIC_AUTH_USER}
      BASIC_AUTH_HASH: ${BASIC_AUTH_HASH}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
    depends_on: [app]

volumes:
  pgdata:
  caddydata:
