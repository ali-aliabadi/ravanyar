# Paste inside the existing `server { server_name margin.alialiabadi.ir; ... }` block.
# Cloudflare + the host's origin cert handle TLS; the API stays on localhost.
location /api/static/ {
    alias /srv/ravanyar-static/;
}

location /api/ {
    # Pre-launch: one login in front of the API, so nobody can trigger paid SMS sends.
    # Create with: htpasswd -c /etc/nginx/ravanyar.htpasswd ravanyar
    auth_basic "Ravanyar pre-launch";
    auth_basic_user_file /etc/nginx/ravanyar.htpasswd;

    proxy_pass http://127.0.0.1:18082;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;
}
