# 1) http context - save as /etc/nginx/conf.d/ravanyar-ratelimit.conf:
#
#   # shortcut: the header is spoofable by requests that skip Cloudflare; restrict origin to CF IPs before launch.
#   limit_req_zone $http_cf_connecting_ip zone=ravanyar_sms:1m rate=3r/m;
#
# 2) Paste the rest inside the existing `server { server_name margin.alialiabadi.ir; ... }` block.
# Cloudflare + the host's origin cert handle TLS; the API stays on localhost.
# No basic auth: the API's Bearer token uses the same Authorization header and would clash.

location /api/static/ {
    alias /srv/ravanyar-static/;
}

# Each code request sends a paid SMS: cap it per client IP (Cloudflare's real-IP header).
location = /api/auth/code {
    limit_req zone=ravanyar_sms burst=2 nodelay;
    proxy_pass http://127.0.0.1:18082;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
}

location /api/ {
    proxy_pass http://127.0.0.1:18082;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
}

# The web client (frontend/), straight from the checkout. Replace the server block's existing
# `root` and `location /`: other locations (e.g. a no-cache `= /index.html`) use this root too.
root /srv/ravanyar/frontend;
location / {
    try_files $uri /index.html;
}
